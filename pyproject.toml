[tool.poetry]
name = "mafic"
version = "2.11.0"
description = "A properly typehinted lavalink client for discord.py, nextcord, disnake and py-cord."
authors = ["ooliver1 <oliverwilkes2006@icloud.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ooliver1/mafic"
homepage = "https://github.com/ooliver1/mafic"
keywords = [
    "nextcord",
    "disnake",
    "discord",
    "disnake.py",
    "lavalink",
    "lavalink.py",
    "pycord",
    "py-cord",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Framework :: aiohttp",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

packages = [{ include = "mafic" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
aiohttp = "^3.14.3"
orjson = { version = "^3.12.0", optional = true }
yarl = "^1.24.5"

[tool.poetry.extras]
speedups = ["orjson"]

[tool.poetry.group.dev.dependencies]
pyright = "1.1.414"
black = "26.5.1"
taskipy = "1.14.1"
pre-commit = "4.6.2"
python-dotenv = { version = "1.2.3", extras = ["cli"] }
slotscheck = "0.21.0"
typing-extensions = "4.16.0"
ruff = "0.16.6"

# The default development environment uses one Discord library.
[tool.poetry.group.lint.dependencies]
nextcord = "3.2.0"

[tool.poetry.group.disnake]
optional = true

[tool.poetry.group.disnake.dependencies]
disnake = "2.12.1"

[tool.poetry.group.discordpy]
optional = true

[tool.poetry.group.discordpy.dependencies]
"discord.py" = "2.7.1"

[tool.poetry.group.pycord]
optional = true

[tool.poetry.group.pycord.dependencies]
py-cord = { version = "2.8.1", extras = ["voice"] }

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^6.1.3"
sphinx-autobuild = "^2021.3.14"
sphinxcontrib-trio = "^1.1.2"
furo = "^2022.12.7"
sphinx-inline-tabs = "^2022.1.2b11"
# autodoc-typehints is much better than the default sphinx autodoc typehints
# properly searching for typehints in the code, and using `code` elements to display them
sphinx-autodoc-typehints = "^1.21.8"

[tool.taskipy.tasks]
pre-commit = "pre-commit install --install-hooks"
lint = "pre-commit run --all-files"
black = "task lint black"
ruff = "task lint ruff-check"
slotscheck = "task lint slotscheck"
pyright = "dotenv -f task.env run -- pyright"
docs = "cd docs && sphinx-autobuild . _build/html --ignore _build --watch ../mafic --port 8069"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.slotscheck]
strict-imports = true
require-superclass = true
require-subclass = false

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["mafic", "tests"]
ignore = ["test_bot", "examples/**"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "D",
    "UP",
    "YTT",
    "ANN",
    "S",
    "BLE",
    "FBT",
    "B",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "ISC",
    "G",
    "PIE",
    "T20",
    "Q",
    "RSE",
    "RET",
    "SIM",
    "TC",
    "ARG",
    "PGH",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "TRY",
    "RUF",
]
# F403, F405 do not need to hate wildcard imports. Pyright can find undefined errors.
# D107, class docstr is in the class level, may change in future.
# D203 and D211, D212 and D213 intentionally clash
# RET505-RET508 does not allow for any branches where it is an elif and else after a return
# PLR2004 too much to deal with right now
# PLR0913 a bit of a churn to deal with for Client and Filter
# Keep existing annotation style; a tooling upgrade is not a typing rewrite.
# S311 I do not need cryptographically secure random node selection thanks
ignore = [
    # Preserve the existing API/annotation layout during the tooling migration.
    "UP017", "UP041", "UP042", "UP045", "UP046", "UP047",
    "RUF022", "RUF023", "TC006", "PLC0415",
    "F403",
    "F405",
    "D107",
    "D203",
    "D213",
    "RET505",
    "RET506",
    "RET507",
    "RET508",
    "PLR2004",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "UP006",
    "UP007",
    "UP035",
    "S311",
]
unfixable = ["RET502", "RET503"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"mafic/typings/*" = ["D"]
"test_bot/*" = ["D", "ANN", "S101", "S106", "RET"]
"docs/*" = ["D"]
"examples/*" = ["D", "ANN", "S101", "S106", "RET"]

[build-system]
requires = ["poetry-core>=2.4,<3"]
build-backend = "poetry.core.masonry.api"
